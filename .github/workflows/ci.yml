name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.19'
      - name: Set up goveralls
        run: go install github.com/mattn/goveralls@latest
      - name: Run unit tests
        run: go test -race -covermode atomic -coverprofile=covprofile ./...
      - name: Run deterministic decoder suite
        # The determinism suite is where the input-immutability, concurrency
        # and fault-injection guarantees are enforced; run it explicitly so a
        # failure names the gate rather than showing up as a coverage drop.
        run: go test -race -count=1 -run 'Deterministic|FaultInjection|RandomReadOrder|InputImmutable|ShareNoStorage|FixturesArePinned|RequiredFeatures|CoverageRecord|PeakMemory|CorruptInput|HeaderValidation|SuiteCoverage|RecordedScale|DecodeConfigMatchesDecode|ImageDecodeDeterministic' ./...
      - name: Send coverage
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goveralls -coverprofile=covprofile -service=github
